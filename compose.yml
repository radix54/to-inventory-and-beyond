services:
  backend:
    image: ghcr.io/cbomkit/cbomkit
    depends_on:
      db:
        condition: service_healthy
    environment:
      CBOMKIT_DB_TYPE: postgresql
      CBOMKIT_DB_JDBC_URL: jdbc:postgresql://db:5432/postgres
      CBOMKIT_PORT: 8081
      CBOMKIT_DB_USERNAME: ${POSTGRESQL_AUTH_USERNAME}
      CBOMKIT_DB_PASSWORD: ${POSTGRESQL_AUTH_PASSWORD}
      CBOMKIT_FRONTEND_URL_CORS: "http://localhost:8001"
      CBOMKIT_OPA_API_BASE: "http://opa:8181"
    ports:
      - "8081:8081"
    volumes:
      - cbomkit-volume:/home/user/.cbomkit
    restart: always
    deploy:
      resources:
        reservations:
          memory: 4g
        limits:
          memory: 8g
    profiles:
      - prod
      - ext-compliance

  frontend:
    image: ghcr.io/cbomkit/cbomkit-frontend
    environment:
      VUE_APP_HTTP_API_BASE: "http://localhost:8081"
      VUE_APP_WS_API_BASE: "ws://localhost:8081"
      VUE_APP_TITLE: "CBOMkit"
      VUE_APP_VIEWER_ONLY: ${CBOMKIT_VIEWER:-false}
    ports:
      - "8001:8000"
    restart: always
    profiles:
      - prod
      - ext-compliance

  db:
    image: docker.io/library/postgres:16-alpine
    user: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRESQL_AUTH_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRESQL_AUTH_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRESQL_AUTH_USERNAME}", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg-volume:/var/lib/postgresql/data/
    restart: always
    profiles:
      - prod
      - ext-compliance

  opa:
    image: docker.io/openpolicyagent/opa:1.15.1
    command:
      - "run"
      - "--addr=0.0.0.0:8181"
      - "--server"
      - "/policies"
    ports:
      - "8181:8181"
    volumes:
      - "./opa:/policies"
    profiles:
      - ext-compliance

volumes:
  cbomkit-volume:
  pg-volume:

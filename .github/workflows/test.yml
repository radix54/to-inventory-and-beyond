name: Tests

on:
    push:
        branches: [ "master", "dev" ]
    pull_request:
        branches: [ "master", "dev" ]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                go-version: 1.26

            - name: Run Tests
              run: |
                cd To-Inventory-and-Beyond
                go test -v ./...
